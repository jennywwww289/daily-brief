# 來源設定。要調整信的內容來源，改這個檔案即可。
timezone: Asia/Taipei
# 可用環境變數 MODEL 覆蓋
model: claude-sonnet-5-5

# 來源分級。不在任何一級的網域視為 T4（只能當訊號，不能當事實）。
tiers:
