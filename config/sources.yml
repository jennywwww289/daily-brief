    - federalreserve.gov
    - sec.gov
    - cftc.gov
    - ecb.europa.eu
    - imf.org
    - bis.org
    - cbc.gov.tw
    - fsc.gov.tw
    - mof.gov.tw
    - twse.com.tw
    - mops.twse.com.tw
    - ey.gov.tw
    - president.gov.tw
    - arxiv.org
    - nature.com
    - openai.com
    - anthropic.com
